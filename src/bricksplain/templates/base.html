<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bricksplain</title>
<style>
 body { font-family: system-ui, sans-serif; margin: 2rem; }
 .error { background: #fde8e8; border: 1px solid #e0a0a0; padding: .6rem; }
 .warning { background: #fff6dd; border: 1px solid #e0c870; padding: .6rem; }
 table.src { border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 13px; width: 100%; }
 table.src td { padding: 0 .5rem; white-space: pre; }
 td.ln { color: #888; text-align: right; user-select: none; width: 3rem; }
 tr.hl { background: #fff3a3; }
 tr.cell-head td { background: #e8eef7; font-weight: 600; padding: .3rem .5rem; border-top: 2px solid #9ab; }
 .tag { font-size: 12px; font-weight: 600; padding: 0 .4rem; background: #eef; border-radius: 3px; }
 .item.context { color: #555; font-style: italic; }
 .sev-high { background: #f8c6c6; } .sev-medium { background: #fde2b5; } .sev-low { background: #e6f0c8; }
 .tabs { margin: 1rem 0 0; border-bottom: 1px solid #aaa; }
 .tab { padding: .4rem .8rem; border: 1px solid #aaa; border-bottom: none; background: #f2f2f2; cursor: pointer; }
 .tab.active { background: #fff; font-weight: 600; }
 .state { font-size: 11px; color: #666; }
 .status { color: #666; }
</style>
</head>
<body>
<p class="llm" id="llm">Model: {{ llm_label }}</p>
{% block body %}{% endblock %}
</body>
</html>
