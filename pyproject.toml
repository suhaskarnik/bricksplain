[project]
name = "bricksplain"
version = "0.1.0"
description = "Cited explanations of an undocumented Databricks Notebook"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
bricksplain = "bricksplain.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
